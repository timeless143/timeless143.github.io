<!doctype html>
<html lang="{{ page.lang | default: 'en' }}">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>{% if page.title %}{{ page.title }} | {% endif %}Timeless</title>

  <!-- Your original CSS -->
  <link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/overrides.css' | relative_url }}">

  <!-- Alignment & spacing overrides (load after your main CSS) -->
  <link rel="stylesheet" href="{{ '/assets/overrides.css' | relative_url }}" />
</head>
<body class="{{ page.body_class | default: '' }}">
  {% include nav.html %}

  <div class="container">
    {{ content }}
  </div>

  {% include footer.html %}
</body>
</html>
